<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mandate of Dynasties — grand strategy web game inspired by medieval dynasty strategy games." />
  <title>Mandate of Dynasties</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="crest">龍</span>
        <div>
          <h1>Mandate of Dynasties</h1>
          <small>Grand Strategy • Web Edition</small>
        </div>
      </div>

      <div class="resource-strip" aria-label="Sumber pemain">
        <span>🪙 <b id="goldValue">850</b></span>
        <span>🏵️ <b id="prestigeValue">420</b></span>
        <span>📜 <b id="legitimacyValue">72</b></span>
        <span>⚔️ <b id="armyValue">5600</b></span>
      </div>

      <div class="time-controls">
        <button id="pauseBtn" class="icon-btn active" title="Pause">⏸</button>
        <button class="speed-btn" data-speed="1">1</button>
        <button class="speed-btn" data-speed="2">2</button>
        <button class="speed-btn" data-speed="4">3</button>
        <span id="dateValue" class="date-pill">1 Spring, 867</span>
      </div>
    </header>

    <main class="game-layout">
      <nav class="side-nav" aria-label="Menu utama">
        <button data-panel="realm" class="nav-btn active"><span>👑</span><small>Kerajaan</small></button>
        <button data-panel="dynasty" class="nav-btn"><span>🌿</span><small>Dinasti</small></button>
        <button data-panel="court" class="nav-btn"><span>🏛️</span><small>Istana</small></button>
        <button data-panel="marriage" class="nav-btn"><span>💍</span><small>Kahwin</small></button>
        <button data-panel="diplomacy" class="nav-btn"><span>🤝</span><small>Diplomasi</small></button>
        <button data-panel="military" class="nav-btn"><span>⚔️</span><small>Tentera</small></button>
      </nav>

      <section class="map-stage" aria-label="Peta permainan">
        <div class="map-toolbar">
          <span id="mapModeLabel">Peta Politik</span>
          <div>
            <button id="politicalMode" class="mini-btn active">Politik</button>
            <button id="terrainMode" class="mini-btn">Terrain</button>
            <button id="relationsMode" class="mini-btn">Hubungan</button>
          </div>
        </div>

        <div class="map-scroll">
          <svg id="worldMap" class="world-map" viewBox="0 0 1200 760" role="img" aria-label="Peta kerajaan interaktif">
            <defs>
              <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.32"/>
              </filter>
              <pattern id="terrainHatch" width="18" height="18" patternUnits="userSpaceOnUse">
                <path d="M0 18 L18 0" stroke="rgba(255,255,255,.06)" stroke-width="2"/>
              </pattern>
            </defs>

            <path class="ocean" d="M0,0H1200V760H0Z"/>
            <path class="land-base" d="M85 135 C165 60 340 52 438 112 C530 76 681 92 745 159 C860 126 1038 176 1110 275 C1162 347 1124 462 1040 515 C958 566 885 648 759 644 C655 700 525 667 446 617 C354 655 247 623 180 548 C98 505 47 410 72 322 C41 247 43 177 85 135Z"/>

            <g id="provinceLayer" filter="url(#mapShadow)">
              <!-- Northwest -->
              <polygon data-province="frostgate" points="92,151 184,94 260,119 242,221 132,240 75,198" />
              <polygon data-province="silverpass" points="260,119 355,94 425,139 392,231 242,221" />
              <polygon data-province="jadefrontier" points="425,139 515,112 579,165 551,247 392,231" />
              <!-- North -->
              <polygon data-province="longriver" points="132,240 242,221 287,299 232,378 113,348" />
              <polygon data-province="redcliff" points="242,221 392,231 410,320 287,299" />
              <polygon data-province="heavenstep" points="392,231 551,247 555,342 410,320" />
              <polygon data-province="sunreach" points="551,247 674,196 743,249 702,349 555,342" />
              <!-- Center -->
              <polygon data-province="stoneford" points="113,348 232,378 266,463 153,486 82,422" />
              <polygon data-province="northvale" points="232,378 287,299 410,320 407,423 266,463" />
              <polygon data-province="crownplain" points="410,320 555,342 571,447 407,423" />
              <polygon data-province="eastmere" points="555,342 702,349 748,431 651,491 571,447" />
              <polygon data-province="mistlake" points="702,349 822,294 891,357 862,455 748,431" />
              <!-- East -->
              <polygon data-province="goldcoast" points="743,249 845,198 955,231 969,322 891,357 822,294" />
              <polygon data-province="seawatch" points="955,231 1060,258 1122,338 1074,410 969,322" />
              <polygon data-province="pearlbay" points="862,455 1074,410 1095,492 1007,545 910,529" />
              <!-- South -->
              <polygon data-province="embermarch" points="153,486 266,463 356,525 321,603 211,575" />
              <polygon data-province="southgrove" points="266,463 407,423 466,506 423,594 356,525" />
              <polygon data-province="cloudgarden" points="407,423 571,447 584,545 466,506" />
              <polygon data-province="verdantseat" points="571,447 651,491 750,459 799,548 705,620 584,545" />
              <polygon data-province="mooncape" points="799,548 910,529 1007,545 931,612 814,638 705,620" />
            </g>

            <g id="terrainOverlay" class="terrain-overlay hidden">
              <path d="M120 170 Q210 120 310 164" class="mountain-line"/>
              <path d="M420 154 Q505 130 590 196" class="mountain-line"/>
              <path d="M175 424 Q330 392 470 468" class="river-line"/>
              <path d="M470 468 Q650 500 820 402" class="river-line"/>
              <path d="M780 330 Q870 310 950 360" class="river-line"/>
              <ellipse cx="820" cy="393" rx="38" ry="25" class="lake"/>
              <ellipse cx="600" cy="290" rx="26" ry="18" class="lake"/>
              <path d="M0 0H1200V760H0Z" fill="url(#terrainHatch)"/>
            </g>

            <g id="realmLabels" class="realm-labels"></g>
          </svg>
        </div>

        <div class="map-legend">
          <span><i class="dot player"></i> Kerajaan anda</span>
          <span><i class="dot ally"></i> Sekutu</span>
          <span><i class="dot neutral"></i> Neutral</span>
          <span><i class="dot hostile"></i> Bermusuhan</span>
        </div>
      </section>

      <aside class="inspector" id="inspector">
        <div class="ruler-card">
          <div class="portrait" id="rulerPortrait">梁</div>
          <div>
            <small>Pemerintah</small>
            <h2 id="rulerName">Raja Liang Ren</h2>
            <p id="rulerTitle">Wang dari Yunzhou</p>
          </div>
        </div>

        <div id="panelContent" class="panel-content"></div>
      </aside>
    </main>

    <section class="bottom-bar">
      <div class="event-log-wrap">
        <div class="event-log-head">
          <strong>Kronik Kerajaan</strong>
          <button id="clearLog" class="text-btn">Kosongkan</button>
        </div>
        <div id="eventLog" class="event-log"></div>
      </div>
      <div class="save-controls">
        <button id="newGameBtn">Permainan Baru</button>
        <button id="saveBtn">Simpan</button>
        <button id="loadBtn">Muat</button>
      </div>
    </section>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-box">
      <header>
        <h2 id="modalTitle">Pilihan</h2>
        <button class="close-btn" value="cancel" aria-label="Tutup">×</button>
      </header>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
